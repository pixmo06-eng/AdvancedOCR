name: AdvancedOCR
options:
  bundleIdPrefix: com.advancedocr
  deploymentTarget:
    iOS: "17.0"
packages:
  AdvancedOCRKit:
    path: Packages/AdvancedOCRKit
targets:
  AdvancedOCR:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "Camera access is needed to scan Japanese lesson documents and extract text."
        NSPhotoLibraryUsageDescription: "Photo library access is needed to import lesson photos."
        NSLocalNetworkUsageDescription: "AdvancedOCR needs access to your local network to connect to locally hosted AI models (Ollama, LM Studio) on your network."
        NSBonjourServices:
          - "_http._tcp"
          - "_ollama._tcp"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    dependencies:
      - package: AdvancedOCRKit
        product: Core
      - package: AdvancedOCRKit
        product: OCRDomain
      - package: AdvancedOCRKit
        product: OCRData
      - package: AdvancedOCRKit
        product: OCRPresentation
      - package: AdvancedOCRKit
        product: JapaneseLearningDomain
      - package: AdvancedOCRKit
        product: JapaneseLearningData
      - package: AdvancedOCRKit
        product: JapaneseLearningPresentation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pixmo06.AdvancedOCR
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        SWIFT_VERSION: "5.10"
        DEVELOPMENT_TEAM: 3NR3ZN5R55
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
