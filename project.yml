name: AdvancedOCR
options:
  bundleIdPrefix: com.advancedocr
  deploymentTarget:
    iOS: "17.0"
packages:
  AdvancedOCRKit:
    path: Packages/AdvancedOCRKit
targets:
  AdvancedOCR:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    dependencies:
      - package: AdvancedOCRKit
        product: Core
      - package: AdvancedOCRKit
        product: OCRDomain
      - package: AdvancedOCRKit
        product: OCRData
      - package: AdvancedOCRKit
        product: OCRPresentation
      - package: AdvancedOCRKit
        product: JapaneseLearningDomain
      - package: AdvancedOCRKit
        product: JapaneseLearningData
      - package: AdvancedOCRKit
        product: JapaneseLearningPresentation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.advancedocr.app
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Camera access is needed to scan Japanese lesson documents and extract text."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Photo library access is needed to import lesson photos."
        SWIFT_VERSION: "5.10"
